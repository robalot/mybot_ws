; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
board_microros_transport = wifi
monitor_speed = 115200
board_microros_distro = jazzy
lib_deps =
	https://github.com/micro-ROS/micro_ros_platformio.git

; Default: micro_ros_agent reachable via the PC's WiFi interface.
; Flash with: ./pio_build.sh run -t upload
[env:esp32dev]
build_flags = -D AGENT_IP_LAST_OCTET=195

; micro_ros_agent reachable via the PC's Ethernet interface instead.
; Flash with: ./pio_build.sh run -e esp32dev_ethernet -t upload
[env:esp32dev_ethernet]
build_flags = -D AGENT_IP_LAST_OCTET=172

